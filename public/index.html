<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PubTrivia — Binnenkort!</title>
  <meta name="description" content="PubTrivia — de 24/7 digitale pubquiz voor horeca in Nederland. Binnenkort beschikbaar!">
  <link rel="icon" type="image/png" href="/favicon.png">

  <style>
    @font-face {
      font-family: 'Fat Frank';
      src: url('/fonts/FatFrank-Regular.woff2') format('woff2'),
           url('/fonts/FatFrank-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1AD960;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Fat Frank', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 2rem 1.5rem;
      max-width: 700px;
      width: 100%;
    }

    .mascots {
      width: min(550px, 85vw);
      height: auto;
      filter: drop-shadow(0 8px 30px rgba(0,0,0,0.2));
      margin-bottom: 0.5rem;
    }

    .headline {
      color: white;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      text-align: center;
      text-shadow: 0 4px 15px rgba(0,0,0,0.15);
      line-height: 1.1;
      letter-spacing: 0.02em;
      transition: opacity 0.4s ease;
    }

    .headline.fade { opacity: 0; }

    .domain {
      color: rgba(255,255,255,0.7);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      margin-top: 1.5rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="mascots" src="/monster-duo.png" alt="PubTrivia">
    <h1 class="headline" id="headline">Binnenkort!</h1>
    <p class="domain">pub-trivia.nl</p>
  </div>

  <script>
    const texts = ["Binnenkort!", "Coming Soon!"];
    let i = 0;
    const h = document.getElementById("headline");

    setInterval(() => {
      h.classList.add("fade");
      setTimeout(() => {
        i = 1 - i;
        h.textContent = texts[i];
        h.classList.remove("fade");
      }, 400);
    }, 2000);
  </script>
</body>
</html>
